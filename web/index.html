<html lang="en">

<style>
:root{--bg:#0b1030;--fg:#ffe2b0;--panel:#141a40;--edge:#c98a2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1030;--fg:#ffe2b0;--panel:#141a40;--edge:#c98a2e}}
:root[data-theme="dark"]{--bg:#0b1030;--fg:#ffe2b0;--panel:#141a40;--edge:#c98a2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0b1030 0%,#18205a 60%,#4a2a50 100%) fixed,var(--bg);color:var(--fg);font-family:'Press Start 2P',ui-monospace,Menlo,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 12px}
h1{font-size:clamp(14px,3.4vw,22px);margin:0;font-weight:400;letter-spacing:1px}
#wrap{position:relative;width:100%;max-width:960px;border:4px solid var(--edge);background:#000}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}
#say{width:100%;max-width:960px;min-height:3.6em;padding:14px 16px;border:4px solid var(--edge);background:var(--panel);font-size:clamp(9px,1.9vw,12px);line-height:1.8}
#pv{position:absolute;top:32%;width:36%;z-index:3;border:3px solid #f2b84a;background:#1a1210;color:#fff1c9;display:flex;flex-direction:column;box-shadow:0 0 0 3px #1a1210}
#pv[hidden]{display:none}
#ph{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 7px;font-size:clamp(6px,1.4vw,10px);line-height:1.5}
#pn{display:none}
#pgo{flex:none;padding:5px 7px;border:2px solid #1a1210;background:#f2b84a;color:#1a1210;text-decoration:none;font:inherit;font-size:clamp(6px,1.3vw,9px)}
#pgo:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#pb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0d0a1a;border-top:3px solid #f2b84a}
#pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:#efe8ff;font-size:clamp(6px,1.3vw,9px);line-height:1.8}
#pf{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;transform-origin:0 0;pointer-events:none;opacity:0;background:#fff}
#mu{padding:10px 14px;border:3px solid var(--edge);background:#f2b84a;color:#1a1210;font:inherit;font-size:clamp(8px,1.7vw,11px);cursor:pointer}
#mu:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#lb{position:absolute;right:8px;bottom:8px;z-index:4;padding:8px 10px;border:3px solid #1a1210;background:#f2b84a;color:#1a1210;font:inherit;font-size:clamp(7px,1.6vw,11px);cursor:pointer}
#lb:focus-visible{outline:3px solid #fff1c9;outline-offset:2px}
#top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
#hud{position:absolute;top:8px;right:8px;z-index:4;padding:6px 8px;background:#141a40;border:3px solid #c98a2e;color:#ffd36a;font-size:clamp(6px,1.4vw,10px);line-height:1.4}
#wrap{border-color:#c98a2e;background:#0b1030;box-shadow:0 0 28px #ff9a3c55}
#say{background:#141a40;color:#ffe2b0;border-color:#c98a2e}
#ab,#ob{padding:10px 14px;border:3px solid var(--edge);background:#f2b84a;color:#1a1210;font:inherit;font-size:clamp(8px,1.7vw,11px);cursor:pointer}
#ab:focus-visible,#ob:focus-visible,.opt:focus-visible,#avgo:focus-visible,#lx:focus-visible,#lc:focus-visible,#nm:focus-visible,#pr:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#av,#lob{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vw,14px);padding:8px;background:rgba(11,16,48,.94);color:#ffe2b0;text-align:center;overflow:auto}
#av[hidden],#lob[hidden]{display:none}
#av h2,#lob h2{margin:0;font-size:clamp(9px,2.2vw,16px);font-weight:400;color:#ffd36a}
.avrow{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.4vw,24px)}
#avp{width:clamp(48px,14vw,120px);height:auto;aspect-ratio:40/48;border:3px solid #c98a2e;background:#141a40;cursor:default}
.avopts{display:flex;flex-direction:column;gap:clamp(6px,1.4vw,12px);align-items:stretch}
.grp{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.opt{padding:clamp(5px,1.1vw,9px) clamp(6px,1.3vw,12px);border:3px solid #c98a2e;background:#141a40;color:#ffe2b0;font:inherit;font-size:clamp(6px,1.4vw,10px);cursor:pointer}
.opt[aria-pressed="true"]{background:#ffd36a;color:#1a1210;border-color:#fff1c9}
#avgo,#lx{padding:clamp(6px,1.3vw,10px) clamp(10px,2vw,18px);border:3px solid #1a1210;background:#f2b84a;color:#1a1210;font:inherit;font-size:clamp(7px,1.6vw,11px);cursor:pointer}
#lc,#nm{font:inherit;font-size:clamp(8px,1.6vw,12px);padding:8px;width:9em;background:#0b1030;color:#ffe2b0;border:3px solid #c98a2e;text-align:center}
#lc{text-transform:uppercase}
#ls,#lr{font-size:clamp(6px,1.4vw,10px);line-height:1.8;max-width:90%}
#lbx{display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1.2vw,10px)}
#lbx[hidden]{display:none}
#lst{flex-direction:column;align-items:stretch;max-height:clamp(52px,12vw,110px);overflow:auto;width:min(92%,26em);font-size:clamp(6px,1.4vw,10px)}
.lbl{display:flex;align-items:center;gap:6px;font-size:clamp(6px,1.4vw,10px)}
#tg{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.tg{position:absolute;transform:translate(-50%,-100%);font-size:clamp(5px,1.2vw,9px);white-space:nowrap;text-shadow:1px 1px 0 #0b1030,-1px 1px 0 #0b1030,1px -1px 0 #0b1030,-1px -1px 0 #0b1030}

:root{--glass:rgba(11,16,48,.5);--glass-hi:rgba(11,16,48,.8);--glass-edge:rgba(201,138,46,.7)}
#hud,#mm,#chat,#lb{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#hud{background:var(--glass);border-color:var(--glass-edge);text-shadow:1px 1px 0 #0b1030}
#lb{background:rgba(242,184,74,.72);border-color:rgba(26,18,16,.6)}

#av,#lob{background:rgba(11,16,48,.84);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#mm{position:absolute;left:8px;top:8px;z-index:4;width:clamp(96px,26%,200px);height:auto;aspect-ratio:176/120;border:3px solid var(--glass-edge);background:var(--glass);opacity:.9;cursor:default;image-rendering:auto}
#chat{position:absolute;left:8px;bottom:8px;z-index:4;width:min(46%,320px);min-width:150px;display:flex;flex-direction:column;border:3px solid var(--glass-edge);background:var(--glass);color:#ffe9c2;font-size:clamp(6px,1.35vw,10px);line-height:1.6;transition:background .15s}
#chat[hidden]{display:none}

#chat:focus-within{background:var(--glass-hi)}
#chh{display:flex;align-items:center;gap:8px;width:100%;padding:5px 7px;border:0;background:transparent;color:#ffd36a;font:inherit;text-align:left;cursor:pointer}
#chh span:first-child{flex:1;white-space:nowrap}
#chn{padding:0 5px;background:#ff7a45;color:#1a1210}
#chn[hidden]{display:none}
#chb{display:flex;flex-direction:column;border-top:2px solid var(--glass-edge)}
#chat[data-open="0"] #chb{display:none}

#chl .none{color:rgba(255,226,176,.55)}
#chf{display:flex;border-top:2px solid var(--glass-edge)}
#chin{flex:1;min-width:0;padding:6px 7px;border:0;background:rgba(0,0,0,.28);color:#ffe9c2;font:inherit}

#chh:focus-visible,#chs:focus-visible,#chin:focus-visible{outline:2px solid #fff1c9;outline-offset:-2px}
</style>
</head>
<body>
<div id="top"><h1>Pixel Valley Lantern Festival</h1><button id="mu" type="button">♪ Play lofi</button><button id="ab" type="button">☺ Avatar</button><button id="ob" type="button">Online</button></div>

<div id="av" role="dialog" aria-label="Choose your avatar"><h2>Choose your avatar</h2>
<div class="avrow"><canvas id="avp" width="40" height="48"></canvas><div class="avopts">
<div class="grp" role="group" aria-label="Body"><button class="opt" type="button" data-k="g" data-v="m">Male</button><button class="opt" type="button" data-k="g" data-v="f">Female</button></div>
<div class="grp" role="group" aria-label="Outfit"><button class="opt" type="button" data-k="o" data-v="jp">Traditional Japanese</button><button class="opt" type="button" data-k="o" data-v="we">Western</button><button class="opt" type="button" data-k="o" data-v="sc">Smart casual</button></div>
</div></div><button id="avgo" type="button">Start ⏎</button></div>

<div class="grp"><input id="lc" maxlength="8" autocomplete="off" spellcheck="false" aria-label="Lobby code" placeholder="CODE"><button class="opt" id="lj" type="button">Join code</button></div></div>
<div id="lr"></div>
<div class="grp"><button class="opt" id="ll" type="button" hidden>Leave lobby</button><button id="lx" type="button">Close</button></div></div>
<div id="tg"></div></div>
<div id="say" role="status" aria-live="polite"></div>
<div id="pv" hidden>
  <div id="ph"><div><div id="pt"></div><div id="pn"></div></div><a id="pgo" target="_blank" rel="noopener noreferrer" href="#">Enter ⏎</a></div>
  <div id="pb"><div id="pl">Loading preview…</div><iframe id="pf" title="Site preview" tabindex="-1" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer"></iframe></div>
</div>

}
function renderLob(){
  lr.replaceChildren(...RS.map(p=>{const d=document.createElement('div'),sw=document.createElement('span');sw.textContent='\u25c6 ';sw.style.color=PCOL[p.slot]||PCOL[0];d.append(sw,(p.n||'Player')+(p.id===MYID?' (you)':''));return d}));
  ll.hidden=!(want||adm);lbx.hidden=!!(want||adm);chatVis();
  if(adm)ls.textContent='In lobby '+LCODE.toUpperCase()+' \u00b7 '+RS.length+'/4 players. Share the code with friends.';
}
function applySnap(players){
  RS=players.slice(0,4).sort((a,b)=>a.slot-b.slot);
  const me=RS.find(p=>p.id===MYID);ME=me?me.slot:-1;
  const seen=new Set();
  RS.forEach(p=>{
    if(p.id===MYID)return;seen.add(p.id);
    const q=p.s||{},e=REM.get(p.id)||{x:cl(q.x,704),y:cl(q.y,480)},nm2=q.md?1:0;
    e.tx=cl(q.x,704);e.ty=cl(q.y,480);e.d=(q.d|0)&3;e.m=q.m?1:0;e.s=q.s?1:0;e.slot=Math.max(0,Math.min(3,p.slot|0));
    if(e.md!==undefined&&e.md!==nm2){e.x=e.tx;e.y=e.ty}
    e.md=nm2;e.av=PAL[q.g+q.o]?{g:q.g,o:q.o}:{g:'m',o:'we'};REM.set(p.id,e);
  });
  [...REM.keys()].forEach(k=>{if(!seen.has(k))REM.delete(k)});
  renderLob();
}
const mkCode=()=>{const A='abcdefghjkmnpqrstuvwxyz23456789';let c='';for(let i=0;i<4;i++)c+=A[(Math.random()*A.length)|0];return c};
function connect(code){
  want=true;LCODE=code;lbx.hidden=true;ll.hidden=false;
  ls.textContent=tries?'Connecting\u2026 (attempt '+(tries+1)+')':'Connecting\u2026 a sleeping free server can take up to a minute.';
  let w;try{w=new WebSocket(SRV.replace(/^http/,'ws'))}catch(e){want=false;ls.textContent='Bad server address in config.js.';renderLob();return}
  WS=w;
  w.onopen=()=>{tries=0;w.send(JSON.stringify({t:'join',code,name:NAME,create:CREATE,pub:PUB,s:curState()}));CREATE=false};
  w.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.t==='joined'){MYID=m.id;adm=true;lastS='';clearTimeout(pollT);applySnap(m.players||[]);chl.replaceChildren();(Array.isArray(m.chat)?m.chat:[]).forEach(c=>addChat(c,true));chEmpty()}
    else if(m.t==='chat'&&adm)addChat(m);
    else if(m.t==='snap'&&adm)applySnap(m.players||[]);
    else if(m.t==='taken'){WS=null;if(++mkTries<5){CREATE=true;connect(mkCode())}else leaveLobby('Could not create a lobby. Try again.')}
    else if(m.t==='full')leaveLobby('Lobby '+code.toUpperCase()+' is full (4/4).');
    else if(m.t==='err')leaveLobby(String(m.m||'Server error').slice(0,80))};
  w.onclose=()=>{
    if(WS!==w)return;WS=null;const was=adm;adm=false;RS=[];ME=-1;REM.clear();
    if(want&&tries<12){tries++;ls.textContent=was?'Connection lost. Reconnecting\u2026':ls.textContent;rt=setTimeout(()=>connect(code),Math.min(5000,1500*tries))}
    else{want=false;ls.textContent='Could not reach the server.'}
    renderLob();
  };
  w.onerror=()=>{};
}
function leaveLobby(msg){
  want=false;tries=0;CREATE=false;clearTimeout(rt);
  const w=WS;WS=null;adm=false;RS=[];ME=-1;MYID=null;REM.clear();
  if(w){try{w.send(JSON.stringify({t:'leave'}))}catch(e){}try{w.close()}catch(e){}}
  if(msg!==undefined)ls.textContent=msg;
  renderLob();if(!lob.hidden)pollLobbies();
}
function srvOk(){if(SRV_OK)return true;ls.textContent='Server address not set. Edit web/config.js.';return false}
function joinLobby(raw){
  const code=(raw||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8);
  if(code.length<3){ls.textContent='Enter a code of 3 to 8 letters or numbers.';return}
  leaveLobby();if(!srvOk())return;
  CREATE=false;PUB=false;connect(code);
}
function createLobby(){
  leaveLobby();if(!srvOk())return;
  mkTries=0;CREATE=true;PUB=!pr.checked;connect(mkCode());
}
function showList(a){
  lst.replaceChildren();
  const note=t=>{const d=document.createElement('div');d.textContent=t;lst.append(d)};
  if(!a)return note('Server not reachable yet\u2026');
  if(!a.length)return note('No open lobbies. Create one!');
  a.slice(0,20).forEach(l=>{
    const b=document.createElement('button');b.type='button';b.className='opt';
    b.textContent=String(l.host||'Player').slice(0,12)+'\u2019s lobby \u00b7 '+(l.n|0)+'/4 \u00b7 '+String(l.code).toUpperCase();
    b.addEventListener('click',()=>joinLobby(l.code));lst.append(b);
  });
}
async function pollLobbies(){
  clearTimeout(pollT);
  if(lob.hidden||want||adm)return;
  if(!SRV_OK){srvOk();return}
  let a=null;
  try{const r=await fetch(HTTP+'/lobbies',{cache:'no-store'});a=await r.json();if(!Array.isArray(a))a=null}catch(e){}
  if(!lob.hidden&&!want&&!adm){showList(a);pollT=setTimeout(pollLobbies,3000)}
}
function openLob(){menu=true;tx=ty=null;av.hidden=true;lob.hidden=false;renderLob();pollLobbies();nm.focus({preventScroll:true})}
function closeLob(){menu=false;lob.hidden=true;clearTimeout(pollT);ob.blur()}
nm.addEventListener('input',()=>{NAME=nm.value.slice(0,12);try{localStorage.setItem('pv-name',NAME)}catch(e){}if(adm&&WS&&WS.readyState===1&&NAME.trim())WS.send(JSON.stringify({t:'name',name:NAME}))});
ob.addEventListener('click',openLob);$('lx').addEventListener('click',closeLob);
$('lj').addEventListener('click',()=>joinLobby(lcI.value));
$('ln').addEventListener('click',createLobby);
ll.addEventListener('click',()=>leaveLobby('Left the lobby.'));
lcI.addEventListener('keydown',e=>{if(e.key==='Enter')joinLobby(lcI.value)});
if(SRV_OK)try{fetch(HTTP,{mode:'no-cors'}).catch(()=>{})}catch(e){} /* wake a sleeping server */

/* minimap: the whole valley, pre-rendered once at 1/4 scale */
const MMS=.25,mm=$('mm'),MX=mm.getContext('2d');
const MMB=(()=>{
  const o=document.createElement('canvas');o.width=Math.round(WW*MMS);o.height=Math.round(WH*MMS);
  const m=o.getContext('2d');m.imageSmoothingEnabled=true;m.imageSmoothingQuality='high';
  m.drawImage(GR,0,0,o.width,o.height);
  const S=(img,x,y)=>m.drawImage(img,Math.round(x*MMS),Math.round(y*MMS),Math.max(1,Math.round(img.width*MMS)),Math.max(1,Math.round(img.height*MMS)));
  TREES.slice().sort((a,b)=>a[1]-b[1]).forEach(([a,b,p])=>S(p?TS2:TS1,a-17,b-40));
  STALLS.forEach((x,i)=>S(SS[i],x,278));
  BLD.forEach(b=>S(b.spr,b.x,b.y));
  m.strokeStyle='#c9d2ff';m.lineWidth=1;m.beginPath();m.arc(540*MMS,340*MMS,26*MMS,0,6.3);m.stroke();
  m.fillStyle='#ffd36a';m.fillRect(Math.round(540*MMS)-1,Math.round(340*MMS)-1,2,2);
  m.globalCompositeOperation='multiply';m.fillStyle='#9aa4e0';m.fillRect(0,0,o.width,o.height);
  return o;
})();
const LIBDOOR=[568,190]; /* where players inside the library appear on the valley map */
function mmDot(x,y,k,me,inside){
  const a=Math.round(x),b=Math.round(y),r=me?2:1;
  MX.fillStyle='#0b1030';MX.fillRect(a-r-1,b-r-1,r*2+3,r*2+3);
  MX.fillStyle=k;MX.fillRect(a-r,b-r,r*2+1,r*2+1);
  if(inside){MX.fillStyle='#0b1030';MX.fillRect(a,b,1,1)}
  if(me&&(t>>4)&1){MX.strokeStyle='#fff';MX.lineWidth=1;MX.strokeRect(a-r-1.5,b-r-1.5,r*2+4,r*2+4)}
}
function drawMM(){
  MX.drawImage(MMB,0,0);
  if(mode==='town'){MX.strokeStyle='rgba(255,255,255,.7)';MX.lineWidth=1;MX.strokeRect(Math.round(camx*MMS)+.5,Math.round(camy*MMS)+.5,Math.round(VW*MMS)-1,Math.round(VH*MMS)-1)}
  REM.forEach(e=>{
    const k=PCOL[e.slot]||PCOL[0];
    if(e.md)mmDot(LIBDOOR[0]*MMS+(e.slot-1.5)*4,LIBDOOR[1]*MMS,k,false,true);
    else mmDot(e.x*MMS,e.y*MMS,k,false,false);
  });
  const k=myCol()||'#ffffff';
  if(mode==='lib')mmDot(LIBDOOR[0]*MMS+((ME<0?1.5:ME)-1.5)*4,LIBDOOR[1]*MMS,k,true,true);
  else mmDot(px*MMS,py*MMS,k,true,false);
}

/* lobby chat */
const chat=$('chat'),chh=$('chh'),chn=$('chn'),chl=$('chl'),chin=$('chin'),chs=$('chs'),chi=$('chi');
let chOpen=innerWidth>=600,chUnread=0,chLast=0;
try{const v=localStorage.getItem('pv-chat');if(v!==null)chOpen=v==='1'}catch(e){}
function chSet(o){
  chOpen=!!o;chat.dataset.open=chOpen?'1':'0';chh.setAttribute('aria-expanded',chOpen);chi.textContent=chOpen?'-':'+';
  if(chOpen){chUnread=0;chn.hidden=true;chl.scrollTop=chl.scrollHeight}else if(document.activeElement===chin)chin.blur();
  try{localStorage.setItem('pv-chat',chOpen?'1':'0')}catch(e){}
}
function chEmpty(){if(!chl.childElementCount){const d=document.createElement('div');d.className='none';d.textContent='No messages yet. Say hi!';chl.append(d)}}
function chatVis(){
  const h=!adm;if(chat.hidden===h)return;
  chat.hidden=h;
  if(h){chin.blur();chl.replaceChildren();chUnread=0;chn.hidden=true}else chSet(chOpen);
}
function addChat(m,quiet){
  const txt=String(m&&m.m||'').slice(0,120);if(!txt)return;
  const slot=Math.max(0,Math.min(3,(m.slot|0))),d=document.createElement('div'),a=document.createElement('span');
  const ph=chl.querySelector('.none');if(ph)ph.remove();
  a.textContent=String(m.n||'Player').slice(0,12)+': ';a.style.color=PCOL[slot];d.append(a,txt);
  const near=chl.scrollHeight-chl.scrollTop-chl.clientHeight<24;
  chl.append(d);while(chl.childElementCount>60)chl.firstChild.remove();
  if(chOpen){if(near||m.id===MYID)chl.scrollTop=chl.scrollHeight}
  else if(!quiet&&m.id!==MYID){chUnread++;chn.textContent=chUnread>9?'9+':String(chUnread);chn.hidden=false}
}
function sendChat(){
  const v=chin.value.replace(/\s+/g,' ').trim().slice(0,120);
  if(!v||!adm||!WS||WS.readyState!==1)return;
  const n=performance.now();if(n-chLast<600)return;chLast=n;
  WS.send(JSON.stringify({t:'chat',m:v}));chin.value='';
}
chh.addEventListener('click',()=>chSet(!chOpen));
chs.addEventListener('click',()=>{sendChat();chin.focus({preventScroll:true})});
chin.addEventListener('keydown',e=>{
  e.stopPropagation();
  if(e.key==='Enter'){e.preventDefault();if(chin.value.trim())sendChat();else chin.blur()}
  else if(e.key==='Escape')chin.blur();
});
chin.addEventListener('keyup',e=>e.stopPropagation());
chin.addEventListener('focus',()=>{Object.keys(keys).forEach(k=>keys[k]=0);tx=ty=null});
if(matchMedia('(pointer:coarse)').matches)chin.placeholder='Message\u2026';
chSet(chOpen);
avSync();
loop();
</script>
