<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#0b1030;--fg:#ffe2b0;--panel:#141a40;--edge:#c98a2e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1030;--fg:#ffe2b0;--panel:#141a40;--edge:#c98a2e}}
:root[data-theme="dark"]{--bg:#0b1030;--fg:#ffe2b0;--panel:#141a40;--edge:#c98a2e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0b1030 0%,#18205a 60%,#4a2a50 100%) fixed,var(--bg);color:var(--fg);font-family:'Press Start 2P',ui-monospace,Menlo,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px 12px}
h1{font-size:clamp(14px,3.4vw,22px);margin:0;font-weight:400;letter-spacing:1px}
#wrap{position:relative;width:100%;max-width:960px;border:4px solid var(--edge);background:#000}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer;touch-action:manipulation}
#say{width:100%;max-width:960px;min-height:3.6em;padding:14px 16px;border:4px solid var(--edge);background:var(--panel);font-size:clamp(9px,1.9vw,12px);line-height:1.8}
#pv{position:absolute;top:32%;width:36%;z-index:3;border:3px solid #f2b84a;background:#1a1210;color:#fff1c9;display:flex;flex-direction:column;box-shadow:0 0 0 3px #1a1210}
#pv[hidden]{display:none}
.fpv #pv{display:none!important}
#ph{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:5px 7px;font-size:clamp(6px,1.4vw,10px);line-height:1.5}
#pn{display:none}
#pgo{flex:none;padding:5px 7px;border:2px solid #1a1210;background:#f2b84a;color:#1a1210;text-decoration:none;font:inherit;font-size:clamp(6px,1.3vw,9px)}
#pgo:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#pb{position:relative;aspect-ratio:16/9;overflow:hidden;background:#0d0a1a;border-top:3px solid #f2b84a}
#pl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:#efe8ff;font-size:clamp(6px,1.3vw,9px);line-height:1.8}
#pf{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;transform-origin:0 0;pointer-events:none;opacity:0;background:#fff}
#mu{padding:10px 14px;border:3px solid var(--edge);background:#f2b84a;color:#1a1210;font:inherit;font-size:clamp(8px,1.7vw,11px);cursor:pointer}
#mu:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#lb{position:absolute;right:8px;bottom:8px;z-index:4;padding:8px 10px;border:3px solid #1a1210;background:#f2b84a;color:#1a1210;font:inherit;font-size:clamp(7px,1.6vw,11px);cursor:pointer}
#lb:focus-visible{outline:3px solid #fff1c9;outline-offset:2px}
#top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
#hud{position:absolute;top:8px;right:8px;z-index:4;padding:6px 8px;background:#141a40;border:3px solid #c98a2e;color:#ffd36a;font-size:clamp(6px,1.4vw,10px);line-height:1.4}
#wrap{border-color:#c98a2e;background:#0b1030;box-shadow:0 0 28px #ff9a3c55}
#say{background:#141a40;color:#ffe2b0;border-color:#c98a2e}
#fpb,#ab,#ob{padding:10px 14px;border:3px solid var(--edge);background:#f2b84a;color:#1a1210;font:inherit;font-size:clamp(8px,1.7vw,11px);cursor:pointer}
#fpb:focus-visible,#ab:focus-visible,#ob:focus-visible,.opt:focus-visible,#avgo:focus-visible,#lx:focus-visible,#lc:focus-visible,#nm:focus-visible,#pr:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
#av,#lob{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,1.6vw,14px);padding:8px;background:rgba(11,16,48,.94);color:#ffe2b0;text-align:center;overflow:auto}
#av[hidden],#lob[hidden]{display:none}
#av h2,#lob h2,#rp h2{margin:0;font-size:clamp(9px,2.2vw,16px);font-weight:400;color:#ffd36a}
.avrow{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2.4vw,24px)}
#avp{width:clamp(48px,14vw,120px);height:auto;aspect-ratio:40/48;border:3px solid #c98a2e;background:#141a40;cursor:default}
.avopts{display:flex;flex-direction:column;gap:clamp(6px,1.4vw,12px);align-items:stretch}
.grp{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.opt{padding:clamp(5px,1.1vw,9px) clamp(6px,1.3vw,12px);border:3px solid #c98a2e;background:#141a40;color:#ffe2b0;font:inherit;font-size:clamp(6px,1.4vw,10px);cursor:pointer}
.opt[aria-pressed="true"]{background:#ffd36a;color:#1a1210;border-color:#fff1c9}
#avgo,#lx,#rx{padding:clamp(6px,1.3vw,10px) clamp(10px,2vw,18px);border:3px solid #1a1210;background:#f2b84a;color:#1a1210;font:inherit;font-size:clamp(7px,1.6vw,11px);cursor:pointer}
#lc,#nm{font:inherit;font-size:clamp(8px,1.6vw,12px);padding:8px;width:9em;background:#0b1030;color:#ffe2b0;border:3px solid #c98a2e;text-align:center}
#lc{text-transform:uppercase}
#ls,#lr{font-size:clamp(6px,1.4vw,10px);line-height:1.8;max-width:90%}
#lbx{display:flex;flex-direction:column;align-items:center;gap:clamp(5px,1.2vw,10px)}
#lbx[hidden]{display:none}
#lst{flex-direction:column;align-items:stretch;max-height:clamp(52px,12vw,110px);overflow:auto;width:min(92%,26em);font-size:clamp(6px,1.4vw,10px)}
.lbl{display:flex;align-items:center;gap:6px;font-size:clamp(6px,1.4vw,10px)}
#tg{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.tg{position:absolute;transform:translate(-50%,-100%);font-size:clamp(5px,1.2vw,9px);white-space:nowrap;text-shadow:1px 1px 0 #0b1030,-1px 1px 0 #0b1030,1px -1px 0 #0b1030,-1px -1px 0 #0b1030}
/* translucent in-game interface */
:root{--glass:rgba(11,16,48,.5);--glass-hi:rgba(11,16,48,.8);--glass-edge:rgba(201,138,46,.7)}
#hud,#mm,#chat,#lb{-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#hud{background:var(--glass);border-color:var(--glass-edge);text-shadow:1px 1px 0 #0b1030;max-width:calc(74% - 20px);text-align:right}
#lb{background:rgba(242,184,74,.72);border-color:rgba(26,18,16,.6)}
#lb:hover,#lb:focus-visible{background:rgba(242,184,74,.96)}
#sgx{position:absolute;left:8px;bottom:8px;z-index:4;padding:8px 10px;border:3px solid rgba(26,18,16,.6);background:rgba(242,184,74,.72);color:#1a1210;font:inherit;font-size:clamp(7px,1.6vw,11px);cursor:pointer}
#sgx[hidden]{display:none}
#sgx:hover,#sgx:focus-visible{background:rgba(242,184,74,.96)}
#sgx:focus-visible{outline:3px solid #fff1c9;outline-offset:2px}
#av,#lob{background:rgba(11,16,48,.84);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#mm{position:absolute;left:8px;top:8px;z-index:4;width:clamp(96px,26%,200px);height:auto;aspect-ratio:256/120;border:3px solid var(--glass-edge);background:var(--glass);opacity:.9;cursor:default;image-rendering:auto}
#chat{position:absolute;left:8px;bottom:8px;z-index:4;width:min(46%,320px);min-width:150px;display:flex;flex-direction:column;border:3px solid var(--glass-edge);background:var(--glass);color:#ffe9c2;font-size:clamp(6px,1.35vw,10px);line-height:1.6;transition:background .15s}
#chat[hidden]{display:none}
#chat[data-open="0"]{width:auto;min-width:0}
#chat:focus-within{background:var(--glass-hi)}
#chh{display:flex;align-items:center;gap:8px;width:100%;padding:5px 7px;border:0;background:transparent;color:#ffd36a;font:inherit;text-align:left;cursor:pointer}
#chh span:first-child{flex:1;white-space:nowrap}
#chn{padding:0 5px;background:#ff7a45;color:#1a1210}
#chn[hidden]{display:none}
#chb{display:flex;flex-direction:column;border-top:2px solid var(--glass-edge)}
#chat[data-open="0"] #chb{display:none}
#chl{height:clamp(54px,12vw,120px);overflow-y:auto;padding:5px 7px;overflow-wrap:anywhere;scrollbar-width:thin;scrollbar-color:#c98a2e transparent}
#chl div{margin-bottom:3px;text-shadow:1px 1px 0 #0b1030}
#chl .none{color:rgba(255,226,176,.55)}
#chf{display:flex;border-top:2px solid var(--glass-edge)}
#chin{flex:1;min-width:0;padding:6px 7px;border:0;background:rgba(0,0,0,.28);color:#ffe9c2;font:inherit}
#chin::placeholder{color:rgba(255,226,176,.55)}
#chs{flex:none;padding:6px 8px;border:0;border-left:2px solid var(--glass-edge);background:rgba(242,184,74,.65);color:#1a1210;font:inherit;cursor:pointer}
#chs:hover{background:rgba(242,184,74,.95)}
#chh:focus-visible,#chs:focus-visible,#chin:focus-visible{outline:2px solid #fff1c9;outline-offset:-2px}

/* dojo: the Pixel Fighter game runs in an iframe inside the dojo building */
#dj{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:#120d1c}
#dj[hidden]{display:none}
#djb{display:flex;align-items:center;gap:10px;padding:6px 8px;padding-top:calc(6px + env(safe-area-inset-top,0px));background:#141a40;border-bottom:3px solid #c98a2e;font-size:clamp(6px,1.5vw,10px);line-height:1.6;color:#ffd36a}
#djx{flex:none;padding:7px 10px;border:3px solid #1a1210;background:#f2b84a;color:#1a1210;font:inherit;cursor:pointer}
#djx:focus-visible{outline:3px solid #fff1c9;outline-offset:2px}
#djb{flex-wrap:wrap}#djr{display:flex;gap:6px;flex-wrap:wrap}#djr button{font:inherit;padding:5px 8px;background:#2a3370;color:#fff;border:2px solid #c98a2e;cursor:pointer}#djr button.on{background:#c98a2e;color:#141a40}#djr button:disabled:not(.on){opacity:.5;cursor:default}#djs{flex:1;min-width:0;overflow-wrap:anywhere}
#djw{flex:1;min-height:0}
#djw iframe{display:block;width:100%;height:100%;border:0;background:#120d1c}
#rp{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,1.3vw,10px);padding:8px;background:rgba(11,16,48,.92);color:#ffe2b0;text-align:center;overflow:auto;font-size:clamp(6px,1.4vw,10px)}
#rp[hidden]{display:none}
#rl{max-width:92%}
#rl .opt:disabled{opacity:.45;cursor:default}
#rx:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
</style>
</head>
<body>
<div id="top"><h1>Pixel Valley Lantern Festival</h1><button id="mu" type="button">♪ Play lofi</button><button id="fpb" type="button" aria-pressed="false">◉ First person</button><button id="ab" type="button">☺ Avatar</button><button id="ob" type="button">Online</button></div>
<div id="wrap"><canvas id="c" width="240" height="160" aria-label="A pixel town at night during a lantern festival, with a bistro, a dojo and a library"></canvas><canvas id="mm" width="256" height="120" role="img" aria-label="Minimap of the whole valley showing where each player is"></canvas><div id="hud"></div><button id="sgx" type="button" hidden>✕ Exit ⎋</button><button id="lb" type="button" hidden></button>
<div id="chat" data-open="1" hidden><button id="chh" type="button" aria-expanded="true" aria-controls="chb"><span>Lobby chat</span><span id="chn" hidden></span><span id="chi" aria-hidden="true">-</span></button>
<div id="chb"><div id="chl" role="log" aria-live="polite" aria-label="Lobby chat messages"></div>
<div id="chf"><input id="chin" maxlength="120" autocomplete="off" spellcheck="false" aria-label="Chat message" placeholder="Press T to chat"><button id="chs" type="button">Send</button></div></div></div>
<div id="av" role="dialog" aria-label="Choose your avatar"><h2>Choose your avatar</h2>
<div class="avrow"><canvas id="avp" width="40" height="48"></canvas><div class="avopts">
<div class="grp" role="group" aria-label="Body"><button class="opt" type="button" data-k="g" data-v="m">Male</button><button class="opt" type="button" data-k="g" data-v="f">Female</button></div>
<div class="grp" role="group" aria-label="Outfit"><button class="opt" type="button" data-k="o" data-v="jp">Traditional Japanese</button><button class="opt" type="button" data-k="o" data-v="we">Western</button><button class="opt" type="button" data-k="o" data-v="sc">Smart casual</button></div>
</div></div><button id="avgo" type="button">Start ⏎</button></div>
<div id="lob" role="dialog" aria-label="Online lobby" hidden><h2>Online lobby · up to 4 players</h2>
<div class="grp"><label class="lbl" for="nm">Name</label><input id="nm" maxlength="12" autocomplete="off" spellcheck="false" placeholder="Your name"></div>
<div id="ls" role="status" aria-live="polite">Pick an open lobby or create your own.</div>
<div id="lbx"><div id="lst" class="grp" role="group" aria-label="Open lobbies"></div>
<div class="grp"><button class="opt" id="ln" type="button">New lobby</button><label class="lbl"><input type="checkbox" id="pr"> Private</label></div>
<div class="grp"><input id="lc" maxlength="8" autocomplete="off" spellcheck="false" aria-label="Lobby code" placeholder="CODE"><button class="opt" id="lj" type="button">Join code</button></div></div>
<div id="lr"></div>
<div class="grp"><button class="opt" id="ll" type="button" hidden>Leave lobby</button><button id="lx" type="button">Close</button></div></div>
<div id="rp" role="dialog" aria-label="Diner upgrades" hidden><h2>Diner upgrades · $<span id="rc">0</span></h2><div id="rl" class="grp"></div><button id="rx" type="button">Close</button></div>
<div id="tg"></div></div>
<div id="say" role="status" aria-live="polite"></div>
<div id="pv" hidden>
  <div id="ph"><div><div id="pt"></div><div id="pn"></div></div><a id="pgo" target="_blank" rel="noopener noreferrer" href="#">Enter ⏎</a></div>
  <div id="pb"><div id="pl">Loading preview…</div><iframe id="pf" title="Site preview" tabindex="-1" sandbox="allow-scripts allow-same-origin" referrerpolicy="no-referrer"></iframe></div>
</div>
<div id="dj" hidden><div id="djb"><button id="djx" type="button">&larr; Leave dojo</button><div id="djs" role="status" aria-live="polite"></div><div id="djr"></div></div><div id="djw"></div></div>
<script src="config.js"></script>
<script>
const c=document.getElementById('c'),X=c.getContext('2d'),say=document.getElementById('say'),hud=document.getElementById('hud');
let g=X;
const VW=240,VH=160,WW=1024,WH=480,warm='#ffd37a',gold='#f2b84a';
const R=(a,b,w,h,k)=>{g.fillStyle=k;g.fillRect(a,b,w,h)};
const C=(a,b,r,k)=>{for(let dy=-r;dy<=r;dy++){const w=Math.round(Math.sqrt(r*r-dy*dy));R(a-w,b+dy,w*2+1,1,k)}};

const GL={R:"110101110101101",A:"010101111101101",B:"110101110101110",I:"111010010010111",S:"011100010001110",T:"111010010010010",O:"010101101101010",D:"110101101101110",J:"001001001101010",L:"100100100100111",Y:"101101010010010",F:"111100110100100",G:"011100101101011",H:"101101111101101",C:"111100100100111",E:"111100110100111",N:"101111111111101",K:"101101110101101"," ":"000000000000000"};
const T=(s,a,b,k)=>{[...s].forEach((ch,i)=>{const q=GL[ch];for(let j=0;j<15;j++)if(q[j]==='1')R(a+i*4+j%3,b+((j/3)|0),1,1,k)})};
const hh=(a,b)=>{let h=Math.imul(a+1,374761393)^Math.imul(b+7,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};

/* ground */
const PATHS=[[0,224,WW,32],[104,192,32,32],[336,192,32,32],[552,192,32,32],[756,192,32,32],[442,192,32,32],[104,256,32,44],[548,256,32,44],[136,256,340,64],[840,256,32,44]];
const fh=(x1,x2,y)=>{R(x1,y,x2-x1,2,'#b08a52');R(x1,y+4,x2-x1,2,'#b08a52');for(let a=x1;a<=x2;a+=16)R(a,y-3,3,10,'#8a6238');sol(x1,y-1,x2-x1,6)};

  const gs=['#78b84a','#72b146','#7dbf4e'];

  PATHS.forEach(([a,b,w,h])=>R(a,b,w,h,'#a8723e'));

  for(let yy=-ry-2;yy<=ry+2;yy++){const w=Math.round((rx+3)*Math.sqrt(Math.max(0,1-(yy/(ry+2))**2)));R(cx-w,cy+yy,w*2,1,'#d6c590')}
  for(let yy=-ry;yy<=ry;yy++){const w=Math.round(rx*Math.sqrt(1-(yy/ry)**2));R(cx-w,cy+yy,w*2,1,yy<-ry+4?'#2f78b4':'#3f97d6')}
  for(let i=0;i<40;i++)R(cx-40+(hh(i,9)*80|0),cy-24+(hh(i,8)*48|0),4,1,'#7cc3ee');
  [[84,330],[120,350],[100,366],[140,336]].forEach(([a,b])=>{C(a,b,3,'#4f9a40');R(a+1,b-1,2,2,'#ff8fb4')});
  sol(54,310,58,68);sol(128,310,26,68);sol(112,352,16,26);

  R(480,304,128,80,'#a8723e');
  for(let r=0;r<20;r++)R(480,304+r*4,128,1,'#7a4a28');
  const cr=[['#4f9a40','#8cd05a'],['#e8892a','#f4b04a'],['#d9534f','#f08a80'],['#e8d34a','#4f9a40'],['#9a60c0','#7ab05a']];
  fh(472,548,296);fh(580,632,296);fh(472,632,392);fv(472,296,392);fv(630,296,392);
});
/* sprites */
function roof(ox,w,y0,rows,ins,c1,c2){
  for(let r=0;r<rows;r++){const i0=ins(r),y=y0+r*4;R(ox+i0,y,w-2*i0,4,c2);
    for(let i=i0;i<w-i0;i+=8){const xx=i+(r%2)*4,ww=Math.min(7,w-i0-xx);if(ww>0&&xx>=i0){R(ox+xx,y,ww,3,c1);R(ox+xx,y+3,ww,1,c2)}}}

<div class="move"><span class="move-name">KAZE · all-rounder</span><small>Balanced fighter with the standard kit.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Fireball</b> Straight projectile. Heavy is faster and stronger.</dd><dt>↓↙←</dt><dd><b>Tatsumaki Senpukyaku</b> Spinning kick that advances: 2 / 3 / 4 hits (Light / Medium / Heavy), last hit knocks down. Punishable.</dd><dt>(↓↘→)×2</dt><dd><b>Super Fireball</b> <i>SUPER</i> Big fireball, invincible startup, chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Shinku Tatsumaki</b> <i>SUPER</i> 7-hit hurricane kick, invincible startup, chip damage.</dd><dt>↓↘→</dt><dd><b>Air Fireball</b> <i>AIR</i> Fires down toward the opponent.</dd><dt>↓↙←</dt><dd><b>Air Tatsumaki</b> <i>AIR</i> Floating spin kick, quicker startup.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Rush Kick Combo</b> <i>ULTRA</i> Lunge into a cinematic kick combo.</dd></dl></div><div class="move"><span class="move-name">DARK KAZE · transformation</span><span class="motion">← ↙ ↓ ↘ → + Heavy</span><small>Costs 1 super bar (Kaze, on the ground). Lasts about 18s or until the round ends. Faster, hits 15% harder, takes 8% less. All moves revamped: Umbra Orbs (↓↘→, 1/2/3 orb stream), Wraith Slash (↓↙←, ghosting dash-slash), Eclipse Rise (→↓↘, spinning uppercut), Abyss Vortex (air ↓↙←), Void Cannon (↓↘→ ×2), Shadow Requiem (↓↙← ×2), plus sharper normals and a new auto-combo finisher set.</small></div>

<div class="move"><span class="move-name">HAYABUSA · ninja</span><small>Scorpion-style shinobi: quick and precise.</small><dl class="ml"><dt>← → + Atk</dt><dd><b>Spear Hook</b> Very long rope spear yanks a standing opponent to you. Crouching ducks it; punishable.</dd><dt>↓↘→</dt><dd><b>Katana Combo</b> Rushing 3 / 4 / 5-hit slash string; last hit knocks down.</dd><dt>↓↙←</dt><dd><b>Fire Warp</b> Sink into flames, burst out behind the opponent (Heavy: far side of the arena).</dd><dt>(↓↘→)×2</dt><dd><b>Bushin Rampage</b> <i>SUPER</i> 7-hit katana rush.</dd><dt>(↓↙←)×2</dt><dd><b>Phoenix Warp</b> <i>SUPER</i> Invincible warp ending in a 7-hit flame slash flurry.</dd><dt>↓↘→</dt><dd><b>Plunging Slash</b> <i>AIR</i> Steep dive.</dd><dt>↓↙←</dt><dd><b>Fire Warp</b> <i>AIR</i> Same warp in the air.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Shinobi Hellfire</b> <i>ULTRA</i> Unblockable spear drag, katana flurry, Izuna-style drop.</dd></dl></div>
<div class="move"><span class="move-name">DANTE · devil hunter</span><small>Sword-gunslinger: Light and Heavy normals are sword swings with extra reach. Press ↑ again in the air to double jump. Style system: every different kind of move in one combo (sword, gun, launcher, rush, air) adds +15% damage and raises his rank (D up to SSS), so mixing it up beats repeating the same move.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Ebony &amp; Ivory</b> Fast pistol rave: 3 / 4 / 6 shots (Light / Medium / Heavy), the last one knocks down on Medium and Heavy.</dd><dt>↓↙←</dt><dd><b>Stinger</b> Longer, harder rushing sword stab; Medium and Heavy knock down.</dd><dt>←↙→</dt><dd><b>Trickster</b> Vanishes in a red flash, reappears behind the opponent and slashes (Heavy knocks down). Combo it into a Stinger or a barrage.</dd><dt>→↓↘</dt><dd><b>Prop Shredder</b> Replaces the flying uppercut: he coils, then rockets up in two fast eased spins with red-and-gold afterimages and sparks trailing the blade, 3 hits (Heavy knocks down). Invincible startup; follow with the air barrage or Twister.</dd><dt>(↓↘→)×2</dt><dd><b>Gunstorm</b> <i>SUPER</i> Invincible startup, 12-shot bullet storm.</dd><dt>(↓↙←)×2</dt><dd><b>Stab Storm</b> <i>SUPER</i> 9-hit stabbing rush.</dd><dt>↓↘→</dt><dd><b>Air Barrage</b> <i>AIR</i> Shots fire diagonally down.</dd><dt>↓↙←</dt><dd><b>Twister</b> <i>AIR</i> Multi-hit spinning sword.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Stylish Shred</b> <i>ULTRA</i> Rides the opponent like a skateboard, slashing and shooting, ollies them into the air for a bullet rain, then plunges down with the sword.</dd></dl></div>
<div class="move"><span class="move-name">GOJO · limitless sorcerer</span><small>Zoning and freeze setups.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Red</b> Fast red fireball, hard knockback.</dd><dt>↓↙←</dt><dd><b>Blue</b> Slower blue fireball that pulls the opponent toward him.</dd><dt>←↙↓↘→</dt><dd><b>Shockwave</b> Unblockable pulse: freezes a grounded opponent in range for 0.5s. Parryable; long recovery if it whiffs. Cannot chain into another Shockwave, and the target is immune to a second freeze until they recover.</dd><dt>(↓↘→)×2</dt><dd><b>Hollow Purple</b> <i>SUPER</i> Huge purple orb, 30 damage.</dd><dt>(↓↙←)×2</dt><dd><b>Hollow Purple</b> <i>SUPER</i> Same move from the back quarter circle.</dd><dt>↓↘→ / ↓↙←</dt><dd><b>Air Red / Blue</b> <i>AIR</i> Fired diagonally down.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Hollow Purple</b> <i>ULTRA</i> Three freezing pulses, "You're weak!", point-blank Hollow Purple.</dd></dl></div>
<div class="move"><span class="move-name">ODETTE · umbrella duelist</span><small>Elegant fencer: long umbrella reach, a counter and a glide. Press ↑ again in the air to float on her open parasol (about 1.4s, steer with ← / →; attack or ↓ to drop). A little frail.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Petal Fan</b> Flicks the parasol open, firing a petal fireball.</dd><dt>↓↙←</dt><dd><b>Pirouette</b> Whirling dance advance with the open parasol: 2 / 3 / 4 hits, last hit knocks down. Punishable.</dd><dt>→↓↘</dt><dd><b>Parasol Rise</b> Rising parasol uppercut (the shared Flying Uppercut).</dd><dt>←↙↓↘→</dt><dd><b>Riposte</b> Open-parasol counter stance: a melee hit during the window is negated and she slips through for a launching counter; projectiles are deflected. Very punishable if nothing hits it.</dd><dt>(↓↘→)×2</dt><dd><b>Petal Storm</b> <i>SUPER</i> Invincible startup, 10 petals fired in a stream, chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Grand Pirouette</b> <i>SUPER</i> 8-hit whirling dance, invincible startup, chip damage.</dd><dt>↓↘→</dt><dd><b>Air Petal Fan</b> <i>AIR</i> Petals fired down toward the opponent.</dd><dt>↓↙←</dt><dd><b>Air Pirouette</b> <i>AIR</i> Floating multi-hit spin.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Petal Waltz</b> <i>ULTRA</i> Lunge, then a waltz around the opponent with umbrella strikes in time, a spiralling lift and a plunging finish.</dd></dl></div>
<div class="move"><span class="move-name">GOKU — ultra instinct</span><small>Fast martial artist with a passive: every 5 seconds he automatically dodges the next hit or projectile, slipping behind the attacker (not throws or Ultras). Dodging a projectile also fires an instant Kamehameha at the shooter from behind, with the same damage as his normal Kamehameha. He glows silver while the dodge is ready; a bar under his health shows the recharge. His dash is extra fast and flashes silver.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Kamehameha</b> Charged blue beam. Heavy is slower but hits harder.</dd><dt>↓↙←</dt><dd><b>Meteor Flurry</b> Rushing barrage of 4 / 5 / 6 punches, last hit knocks down.</dd><dt>(↓↘→)×2</dt><dd><b>Super Kamehameha</b> <i>SUPER</i> Giant fast beam, invincible startup, chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Instinct Barrage</b> <i>SUPER</i> 12-hit punch storm, invincible startup, chip damage.</dd><dt>↓↘→ / ↓↙← in air</dt><dd><b>Air Kamehameha / Air Flurry</b> <i>AIR</i> Beam fired down at the opponent / floating punch barrage.</dd><dt>↓ ↓ ↓ + H</dt><dd><b>Spirit Bomb</b> <i>ULTRA</i> Lunge, a silver Ultra Instinct flurry with teleports, then he reverts to normal and hurls a Spirit Bomb.</dd></dl></div>
<div class="move"><span class="move-name">ARJUN · yoga breather</span><small>Big, slow powerhouse with huge normals. Many of his hits deal recoverable (grey) damage that heals back after a couple of seconds unless you get hit again.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Breathing Ring</b> Slow air ring. Light/Medium fly straight, Heavy angles down at 45°.</dd><dt>↓↙←</dt><dd><b>Cruel Shoulder</b> Shoulder charge, longer with Heavy. Next to your own pillar it becomes <b>Justice Beyond</b>: he grabs the pillar and swings it.</dd><dt>→↓↘</dt><dd><b>Divine Pillar</b> A stone pillar erupts in front (Light near, Heavy far) and stays as a trap for about 7s.</dd><dt>←↙↓↘→</dt><dd><b>Indomitable Defense</b> Breathing counter stance. He slowly marches forward (about 1.2s) and slams into anyone in his way, knocking them back. Absorbs shots and turns a melee hit into a recoverable-damage counter.</dd><dt>↓↘→ ×2</dt><dd><b>Howling Destruction</b> <i>SUPER</i> Rapid bursts of breath.</dd><dt>↓↙← ×2</dt><dd><b>Yaksha's Order</b> <i>SUPER</i> Rushing multi-hit onslaught.</dd><dt>↓ ↓ ↓ + H</dt><dd><b>Yaksha's Order (Ultra)</b> Needs both bars. Shoulder rams, palm strikes and a double ear-clap, then a Divine Pillar erupts, carries the opponent up and he swings it down to shatter it.</dd></dl></div>
<div class="move"><span class="move-name">JP · psycho schemer</span><small>Tall, slow zoner with ghosts and portals. Keep the opponent out with Torbalan and Triglav, then catch jumpers and blockers with Embrace. A bit slower on his feet but very strong at range.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Torbalan</b> Slow psycho ghost that crawls along the ground. Light is slowest, Heavy is fastest and hits low (crouch-block it). Fires in the air too.</dd><dt>↓↙←</dt><dd><b>Embrace</b> A grabbing ghost that cannot be blocked: jump over it. If it catches the opponent, the ghost seizes them by the neck, hoists them into the air, then hurls them down onto the ground. Slow startup and recovery.</dd><dt>←↙↓↘→</dt><dd><b>Departure</b> Opens a psycho portal in mid-air in front of him (Light near / Medium mid / Heavy far) and recovers fast. While it is open, do the motion again: Light/Medium = <b>Window</b>, teleport into the portal and attack out of it (any jump attack); Heavy = <b>Shadow</b>, a thorn bursts down through the portal. Left alone, the portal fires the thorn itself after 5s. One portal at a time; getting hit closes it, and Embrace can't be used while it is open.</dd><dt>→↓↘</dt><dd><b>Triglav</b> Stabs his cane into the ground and thorns erupt a set distance away (short / mid / far). Tall hitbox that catches jumpers.</dd><dt>(↓↘→)×2</dt><dd><b>Chornobog</b> <i>SUPER</i> Fires a long barrage of psycho orbs, last one knocks down. Chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Lovushka</b> <i>SUPER</i> A field of psycho thorns around him hits several times, front and back. Chip damage.</dd><dt>↓ ↓ ↓ + H</dt><dd><b>Interdiction</b> <i>ULTRA</i> Lunge, then he opens portal after portal around the opponent and strikes out of each one, from the front, behind and in the air, finishing with a thorn volley and a point-blank psycho blast.</dd></dl></div>
<div class="move"><span class="move-name">REVENANT · cursed warden</span><small>Armored shade in a tattered teal cloak. Quick on his feet, vanishes and reappears behind you, and leaves traps on the ground. Hits a little harder than average.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Grave Fiend</b> A demon claws up out of the ground (Light near / Medium mid / Heavy far) and seizes a grounded opponent, holding them in place for 1s while they struggle. No knockdown, so you get a free follow-up. Unblockable but parryable, and it whiffs on jumpers. After a hold the opponent is briefly immune to being held again.</dd><dt>↓↙←</dt><dd><b>Shade Step</b> Dissolves into smoke and reappears behind the opponent with a lunging slash (Heavy: far side of the arena). Invulnerable while vanishing; punishable if blocked. Ground only.</dd><dt>←↙↓↘→</dt><dd><b>Gravemark</b> Plants a spectral grave-mark on the floor (Light near / Medium mid / Heavy far). It lingers about 5s and erupts when the opponent touches it. Low to the ground, so it can be jumped. One at a time.</dd><dt>(↓↘→)×2</dt><dd><b>Soul Cannon</b> <i>SUPER</i> Huge soul blast, invincible startup, chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Reaping Warp</b> <i>SUPER</i> Invincible warp ending in a 7-hit slash flurry.</dd><dt>↓↘→</dt><dd><b>Air Soul Bolt</b> <i>AIR</i> Spectral bolt fired down toward the opponent (the ground version is Grave Fiend).</dd><dt>↓↙←</dt><dd><b>Wraith Dive</b> <i>AIR</i> Diagonal dive.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Dread Harvest</b> <i>ULTRA</i> Lunge, then he raises a legion of blue skeletons from the ground. They charge, leap onto the opponent one by one, pile on and tear them apart.</dd></dl></div>
<div class="move"><span class="move-name">LIU · dragon fist</span><small>Bare-chested martial artist in a red headband: quick on his feet, relentless pressure, a touch frail. Every special is fire and kicks.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Dragon Fire</b> Fireball. Heavy is faster and stronger.</dd><dt>↓↙←</dt><dd><b>Bicycle Kick</b> Spins horizontally through the air, rushing forward: 3 / 4 / 5 hits (Light / Medium / Heavy). Punishable on block or whiff. Works in the air too.</dd><dt>←↙↓↘→</dt><dd><b>Flying Dragon Kick</b> Long horizontal dive kick at head height. Knocks down. Crouching ducks it; very punishable if blocked.</dd><dt>→↓↘</dt><dd><b>Rising Uppercut</b> The shared flying uppercut.</dd><dt>(↓↘→)×2</dt><dd><b>Dragon Fire Barrage</b> <i>SUPER</i> Three huge fireballs in a row, invincible startup, chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Bicycle Storm</b> <i>SUPER</i> 8-hit bicycle kick, invincible startup, chip damage.</dd><dt>↓↘→</dt><dd><b>Air Dragon Fire</b> <i>AIR</i> Fires down toward the opponent.</dd><dt>↓↙←</dt><dd><b>Air Bicycle Kick</b> <i>AIR</i> Quicker startup, floats forward while spinning.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Dragon Fury</b> <i>ULTRA</i> Lunge, a rapid-fire punch and kick combo and a launcher, then Liu turns into a fire dragon that coils around the opponent and bites them into the ground.</dd></dl></div>
<div class="move"><span class="move-name">ITACHI · mangekyo prodigy</span><small>Black-cloaked Sharingan master: quick and precise, with no projectiles. His specials are fire, illusions and a spectral warrior. His forward dash (→ →) has a crow carry him through the air.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Katon Fire Breath</b> A jet of flame from his mouth: 4 hits that push the opponent back, the last knocks down. Heavy reaches furthest. Crouching ducks it; punishable on block.</dd><dt>↓↙←</dt><dd><b>Genjutsu</b> Sharingan gaze. Unblockable, traps a grounded opponent in an illusion for about 1s so you get free hits. Parry beats it; slow and punishable on whiff.</dd><dt>←↙↓↘→</dt><dd><b>Susanoo</b> A spectral warrior rises behind him and cuts down with its blade: tall reach, knocks down, punishable on block.</dd><dt>→↓↘</dt><dd><b>Rising Uppercut</b> The shared flying uppercut.</dd><dt>(↓↘→)×2</dt><dd><b>Brothers' Katon</b> <i>SUPER</i> His younger brother Sasuke pops in beside him and the two breathe a wall of fire together: 8 hits, the last knocks down. Invincible startup, chip damage; crouching doesn't duck it.</dd><dt>(↓↙←)×2</dt><dd><b>Tsukuyomi</b> <i>SUPER</i> Unblockable genjutsu: a long 2s trap while the screen turns blood red and the victim slowly bleeds life.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Mangekyo Finale</b> <i>ULTRA</i> Lunge and a quick strike, then Tsukuyomi: the victim is bound to a cross under a blood-red sky and stabbed again and again.</dd></dl></div>
<div class="move"><span class="move-name">MINATO · yellow flash</span><small>Fourth Hokage in the white flame cloak: the fastest fighter, with a very quick dash that leaves yellow afterimages. Light and Heavy are kunai slashes with extra reach. Slightly frail.</small><dl class="ml"><dt>→↓↘</dt><dd><b>Rasengan</b> A spinning chakra orb held in his hand (not a projectile): he drives forward drilling the opponent, 3 / 4 / 5 hits, the last knocks down. Punishable on block. In the air it becomes a diving Rasengan.</dd><dt>↓↙←</dt><dd><b>Flying Raijin</b> Throws a Hiraishin kunai (Light / Medium / Heavy = short / mid / long). If it hits or is blocked he flashes behind the opponent and slashes. If it misses he flashes to wherever it landed. Works in the air.</dd><dt>←↙→↓↘</dt><dd><b>Flash Counter</b> A short stance: if hit by a melee attack or projectile in the window he vanishes, appears behind the attacker and cuts them down. Punishable if it whiffs.</dd><dt>→↓↘</dt><dd><b>Rising Uppercut</b> The shared flying uppercut.</dd><dt>(↓↘→)×2</dt><dd><b>Raijin Rasengan</b> <i>SUPER</i> A fast big kunai. If it connects: he flashes behind the foe, drills a Rasengan into them, launches them, flashes above and slams them into the ground. If blocked: chip damage and the usual flash behind.</dd><dt>(↓↙←)×2</dt><dd><b>Round Slash</b> <i>SUPER</i> Flashes around the opponent between kunai, slashing from both sides: 9 hits, the last knocks down. Invincible startup, chip damage.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Reaper Death Seal</b> <i>ULTRA</i> A flash lunge and kunai slashes from both sides, then the Shinigami rises behind him and rips the victim’s soul out.</dd></dl></div>
<div class="move"><span class="move-name">FAUST · what could this be?</span><small>Lanky doctor with a paper bag on his head and a giant scalpel: slow on his feet, huge reach, and every special is a gamble. Light and Heavy normals are long scalpel swings. Slightly tough.</small><dl class="ml"><dt>↓↘→</dt><dd><b>What Could This Be?</b> Pulls a random item from his coat and tosses it: bomb (explodes on the ground), hammer, bowling ball, a 10-ton weight that drops on the opponent, a meteor, or (rarely) a chicken leg that heals him. Works in the air too.</dd><dt>↓↙←</dt><dd><b>Pogo Hop</b> Bounces forward on a pogo stick in an arc, hitting 3 times, last hit knocks down. Punishable on block.</dd><dt>←↙↓↘→</dt><dd><b>Scalpel Pull</b> Hooks the opponent with a scalpel on a line and drags them in. Crouching ducks it; punishable.</dd><dt>(↓↘→)×2</dt><dd><b>Item Barrage</b> <i>SUPER</i> Throws three items at once. Chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Pogo Frenzy</b> <i>SUPER</i> Long 6-hit pogo rampage. Chip damage.</dd></dl></div>
<div class="move"><span class="move-name">ZEPHYR · sky monk</span><small>Original airbender-style monk: fast on his feet, floaty, a little frail. Light and Medium are quick palm and kick strikes; Heavy normals swing his staff. Press ↑ again in the air to open his staff glider and drift (about 1.2s).</small><dl class="ml"><dt>↓↘→</dt><dd><b>Air Blast</b> Fast spiralling gust that shoves hard; Heavy knocks down. Works in the air too, firing down toward the opponent.</dd><dt>↓↙←</dt><dd><b>Air Scooter</b> Rides a ball of air forward through 4 / 4 / 5 hits, last hit of Heavy knocks down. Can be used in the air. Punishable on block.</dd><dt>←↙↓↘→</dt><dd><b>Whirlwind</b> Slow tornado that drags the opponent toward him. Great for catching someone walking away or setting up a combo.</dd><dt>(↓↘→)×2</dt><dd><b>Great Gale</b> <i>SUPER</i> Huge fast gust, invincible startup, chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Cyclone Rush</b> <i>SUPER</i> Long 7-hit scooter rampage. Chip damage.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Storm Spiral</b> <i>ULTRA</i> Lunge into a flurry, then he lifts the foe into a tornado, spirals around them and dives.</dd></dl></div>
<div class="move"><span class="move-name">NERISSA · tide dancer</span><small>Original waterbender-style fighter: graceful, a little frail. Light and Medium are quick palm and kick strikes; Heavy normals crack a water whip with extra reach.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Water Whip</b> Slow ribbon of water that shoves hard; Heavy is faster and knocks down. Works in the air, firing down toward the opponent.</dd><dt>↓↙←</dt><dd><b>Tide Ring</b> Spins a ring of water around her and rushes forward through 3 / 3 / 4 hits, last hit of Heavy knocks down. Can be used in the air. Punishable on block.</dd><dt>←↙↓↘→</dt><dd><b>Ice Spikes</b> Freezes the ground and raises a cluster of spikes at short / mid / long range. Knocks down.</dd><dt>→↘↓↙← + H</dt><dd><b>Healing Waters</b> Costs half a super bar. Glowing water restores about 12 HP, but she is defenseless while channelling.</dd><dt>(↓↘→)×2</dt><dd><b>Tidal Wave</b> <i>SUPER</i> Huge rolling wave, invincible startup, chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Octopus Whirl</b> <i>SUPER</i> Eight arms of water whirl around her as she rushes through a 7-hit combo. Chip damage.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Bloodbending</b> <i>ULTRA</i> Lunge, then under a full moon she seizes the foe, lifts them and contorts their body until the joints crack, then whips her arm and flings them across the stage.</dd></dl></div>
<div class="move"><span class="move-name">SPYDER · web slinger</span><small>Original Spider-Man-style wall-crawler inspired by Marvel T&#333;kon: the most mobile fighter, quick on his feet with a high jump, but light on damage and a little frail. Light and Medium are quick punches and kicks, Heavy is a high roundhouse. Press &uarr; again in the air to swing on a web (once per jump, hold &larr;/&rarr; to pick the direction) and attack straight out of the swing.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Web Shot</b> Light / Medium / Heavy fire 1 / 2 / 3 webs in a quick string. Works in the air, firing down toward the opponent.</dd><dt>↓↙←</dt><dd><b>Web Zip</b> Swings up and forward on a web, then releases into a diving Zip Kick. Short / mid / long (Light / Medium / Heavy), Heavy knocks down. Works in the air once per jump. Punishable on block.</dd><dt>←↙↓↘→</dt><dd><b>Web Bomb</b> Sticks a web ball in mid-air at short / mid / long range. The first fighter to touch it is snared for about 0.8s. Only one at a time; jump over it.</dd><dt>→↘↓↙←</dt><dd><b>Spidey Sense</b> Short stance: if hit by a melee attack or projectile in the window he slips it and counters. Punishable if it whiffs.</dd><dt>(↓↘→)×2</dt><dd><b>Web Barrage</b> <i>SUPER</i> Three big webs in a row, invincible startup, chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Web Warrior</b> <i>SUPER</i> Lunges in and lands nine consecutive web strikes. Chip damage.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Radioactive Spider</b> <i>ULTRA</i> Lunge into a flurry, then he webs the foe, whirls them overhead, a yellow cab screeches in and he slams them down onto it.</dd></dl></div>
<div class="move"><span class="move-name">MUSASHI · issen swordsman</span><small>Miyamoto Musashi from Onimusha: Way of the Sword: a battered, long-haired ronin with a single katana and the Oni Gauntlet on his off arm. Passive <b>Issen</b> (5 second cooldown, his gauntlet glows when it is ready): if he swings just as the opponent attacks, he is met by an automatic perfect counter-cut. Against melee it deals heavy damage and knocks the attacker down. Against a projectile he teleports in front of the shooter and slashes them to the ground. Timing matters: it only triggers during the first moments of his own attack, so he has to commit to a swing. It does not work on throws or Ultras, and an active Parry goes first. Light, Heavy, crouch and air normals are long-reach katana cuts; Medium is a diagonal cut (air Medium is a boot).</small><dl class="ml"><dt>passive</dt><dd><b>Issen</b> <i>COUNTER</i> Attack as they attack: auto counter-cut, 5s cooldown (gauntlet glows when ready). Projectiles: teleport + slash.</dd><dt>↓↘→</dt><dd><b>Oni Soul</b> Blue soul wisp fired from the gauntlet. Heavy is faster and knocks down. Works in the air, firing down toward the opponent.</dd><dt>↓↙←</dt><dd><b>Battojutsu</b> Sheathed draw-slash lunge, short / mid / long (Light / Medium / Heavy). In the air it becomes a diving falling cut. Punishable on block.</dd><dt>← → + attack</dt><dd><b>Dual Hammer</b> Slams the foe with twin Oni-forged hammers (Light / Medium / Heavy = more reach). They are blasted across the arena into the wall, take extra wall damage, then bounce back to where they were standing and land knocked down. They stay hittable the whole time, so chain a special, a normal or a super into the rebound. Blockable and punishable on block; if the foe blocks, there is no wall bounce. A foe who was just hit by it cannot be hit by another Dual Hammer until they have been back on their feet for about a second.</dd><dt>←↙↓↘→</dt><dd><b>Tenchi Giri</b> Slow Oni-charged overhead cleave with a tall hitbox that also catches jumpers. Knocks down.</dd><dt>(↓↘→)×2</dt><dd><b>Oni Soul Burst</b> <i>SUPER</i> Three big soul wisps in a row, invincible startup, chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Hyakki Giri</b> <i>SUPER</i> Lunging seven-hit katana flurry. Chip damage.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Break Issen</b> <i>ULTRA</i> Lunge into a flurry of cuts that leaves the foe wobbling on their feet, souls drain into his sheathed blade, he blinks through them and sheathes, then every cut lands at once and blasts them skyward.</dd></dl></div>
<div class="move"><span class="move-name">JINU · demon idol</span><small>Saja Boys frontman in a black gat and long coat. A smooth mid-range fighter: throw the gat to control space, then dive in with demon claws. A little fast on his feet, a little frail.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Gat Throw</b> Hurls his spinning black gat. Light/Medium/Heavy = speed, Heavy knocks down. Works in the air too.</dd><dt>↓↙←</dt><dd><b>Soul Snatch</b> Demon-claw lunge, longer with Heavy (Medium/Heavy knock down). In the air it becomes a falling claw dive.</dd><dt>→↓↘</dt><dd><b>Reaper Rise</b> Rising uppercut (the shared Flying Uppercut).</dd><dt>←↙↓↘→</dt><dd><b>Demon Burst</b> A pillar of demon energy erupts in front of him. Slow to start, knocks down and catches jumpers.</dd><dt>(↓↘→)×2</dt><dd><b>Your Idol</b> <i>SUPER</i> Five soul orbs, one per syllable of “I’ll be your I-dol”, each popping up on screen where it lands, with drum hits under them (about 160 BPM). The last orb (“dol”) is big, hits hardest and knocks down. Chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Soul Harvest</b> <i>SUPER</i> Rushing 7-hit claw flurry. Chip damage.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Soda Pop</b> <i>ULTRA</i> Lunge, then Jinu dances in front of the dazed foe. When he hip-thrusts, a fizzing soda geyser erupts under them and flings them skyward.</dd></dl></div>
<div class="move"><span class="move-name">CYCLOPS · phoenix force</span><small>Scott Summers wielding the Phoenix Force: ruby visor, crimson-and-gold suit, fire and optic beams. Standard normals; his specials are all about beams and flame.</small><dl class="ml"><dt>↑ ↑ (air)</dt><dd><b>Flight</b> Tap Up again while airborne to fly: hold Up / Down to climb or dive, left / right to move. About 4 seconds of fuel per jump, refilled on landing. Attacking ends the flight, then Up resumes it.</dd><dt>↓↘→</dt><dd><b>Optic Blast</b> Fast red beam. Heavy knocks down. Works in the air, firing down toward the foe.</dd><dt>↓↙←</dt><dd><b>Firebird Dash</b> Flaming lunge, short / mid / long. In the air it becomes a diving kick.</dd><dt>←↙↓↘→</dt><dd><b>Phoenix Rise</b> Rising flame uppercut that knocks down. Good anti-air.</dd><dt>(↓↘→)×2</dt><dd><b>Phoenix Force</b> <i>SUPER</i> Huge fire wave. Chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Optic Overload</b> <i>SUPER</i> Six-beam barrage. Chip damage.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Phoenix Force</b> <i>ULTRA</i> He drops to his knees and charges, then the beam bursts out of control: his head snaps back, the massive red visor beam lurches skyward and swells to fill the screen, then whips down across the foe and detonates, blasting them away.</dd></dl></div>
<div class="move"><span class="move-name">DEADPOOL · merc with a mouth</span><small>Wade Wilson in red and black, with katanas on his back and pistols on his thighs. Light and Heavy normals are katana slashes with extra reach. Passive <b>Healing Factor</b>: part of any damage he takes turns into grey life (the grey part of his bar) that grows back on its own, unless he is hit again. Specials are grenades, blades and fourth-wall nonsense. Slightly quick and agile, a little more durable than average.</small><dl class="ml"><dt>↓↘→</dt><dd><b>Grenade Toss</b> Lobs a faulty grenade; Light, Medium and Heavy set the throw distance. The three types rotate (Frag, Cluster, Rubber Chicken) and none repeats until all three have been thrown. In the air it becomes <b>Pistol Rain</b>, firing both guns down at the foe.</dd><dt>↓↙←</dt><dd><b>Blade Spin</b> Spins both katanas like a helicopter and rushes forward in a multi-hit whirl. In the air it becomes a diving <b>Foot Dive</b>.</dd><dt>←↙↓↘→</dt><dd><b>4th-Wall Break</b> Strength picks the move: Light is <b>Over Here!</b> (chain hook that yanks a standing foe to him), Medium is <b>Dolphin</b> (arcing headbutt), Heavy is <b>Wind God Fist</b> (lightning-charged rushing punch).</dd><dt>→↘↓↙←</dt><dd><b>Stab Yourself</b> Runs a katana through his own belly: turns some of his HP into grey life, fills a chunk of super meter and starts <b>Merc Mode</b> (about 5-7 seconds, +20% damage). Stronger buttons cost more HP and give more.</dd><dt>(↓↘→)×2</dt><dd><b>Fever Dream</b> <i>SUPER</i> Eight-hit dual-katana rush. Chip damage.</dd><dt>(↓↙←)×2</dt><dd><b>Chimichanga Carpet</b> <i>SUPER</i> Three frag grenades thrown in a row. Knocks down. Chip damage.</dd><dt>↓ · ↓ · ↓ + H</dt><dd><b>Deadpool Corps</b> <i>ULTRA</i> He shouts "assemble" and the Deadpool family (Lady Deadpool, Kidpool, Dogpool, Headpool and Squirrelpool) drops in. They pile on the foe in a cartoon brawl cloud, then everything explodes.</dd></dl></div>

<div><h2>Move List</h2>
<div class="move-list">
<div class="move"><span class="move-name">Fireball</span><span class="motion">↓ ↘ → + Attack</span><small>In the air, it fires down toward your opponent. Heavy attacks are faster and stronger.</small></div>
<div class="move"><span class="move-name">Super Fireball</span><span class="motion">(↓ ↘ →) × 2 + Attack</span><small>Requires 1 full super bar. Stores up to 2 bars; invincible on startup and deals chip damage through block.</small></div>
<div class="move"><span class="move-name">Tatsumaki Senpukyaku</span><span class="motion">↓ ↙ ← + Attack</span><small>Spinning hurricane kick that advances as it hits: 2 / 3 / 4 hits for Light / Medium / Heavy, and the last hit knocks down. Long recovery, so it is punishable if blocked or missed. Can also be used in the air: quicker startup, and you float forward while spinning (the super is ground-only).</small></div>
<div class="move"><span class="move-name">Shinku Tatsumaki Senpukyaku (Kaze)</span><span class="motion">(↓ ↙ ←) × 2 + Attack</span><small>Requires 1 full super bar. Invincible on startup, 7 hits, and deals chip damage through block.</small></div>
<div class="move"><span class="move-name">Flying Uppercut</span><span class="motion">→ ↓ ↘ + Attack</span><small>Invincible while rising, but very punishable if blocked or missed. Ground only.</small></div>
<div class="move"><span class="move-name">Shockwave (Gojo)</span><span class="motion">← ↙ ↓ ↘ → + Attack</span><small>Unblockable pulse that freezes a grounded opponent in range for 0.5s (Light / Medium / Heavy = longer reach). Cannot be chained into another Shockwave. Gojo only.</small></div>
<div class="move"><span class="move-name">Ultra Combo</span><span class="motion">↓ · ↓ · ↓ + Heavy</span><small>Requires both super bars full. Tap Down three separate times, releasing between taps, then press Heavy. Unblockable/unparryable lunge, but can be jumped or dodged. Uses both bars even on a miss; on hit, chains a cinematic combo for 25 damage or executes at 25 HP or less. Every fighter has their own: Kaze's rush kick combo, Blaze's Inferno Rush (a lightning flurry ending in a meteor dive) and Goro's Red Cyclone (a clothesline flurry, launcher and elbow drops, then a spinning Atomic Buster slam), plus Dante's Stylish Shred (he surfs the opponent like a skateboard with sword slashes, pistol fire and a plunging finish), Lightning's Thunder God, Snake's Venom Stomp (a kick flurry ending in a barrage of ground stomps) Hayabusa's Shinobi Hellfire (a spear drag, katana flurry and Izuna-style drop), and Gojo's Hollow Purple (three freezing shockwave pulses, “You're weak!”, then a point-blank Hollow Purple). Odette's Petal Waltz (a lunge into a waltz around the opponent with umbrella strikes, then a spiralling lift and a plunging finish) and JP's Interdiction (a lunge, then strikes out of portals opened around the opponent, from the front, behind and in the air, then a thorn volley and a point-blank psycho blast). Revenant's Dread Harvest (a lunge, then an army of blue skeletons rises, charges, leaps onto the opponent and tears them apart) Minato's Reaper Death Seal (a flash lunge, kunai slashes from both sides, then the Shinigami pulls out the victim's soul). Liu's Dragon Fury (a lunge, a rapid punch and kick flurry and launcher, then he becomes a fire dragon that coils around the opponent and bites them into the ground). Jinu's Soda Pop (a lunge, a dance, then a hip thrust sets off a soda geyser that flings the foe skyward).</small></div>
<div class="move"><span class="move-name">Auto Combo</span><span class="motion">Tap Auto 3×</span><small>Light → Medium → random finisher from the fighter's own specials: Kaze uses Fireball, Flying Uppercut or Tatsumaki; Blaze uses Flame Lunge, Flying Uppercut or Phoenix Rise; Goro uses Double Lariat (short or long) or Flying Uppercut; Hayabusa uses Katana Combo, Spear Hook or Fire Warp (never the uppercut); Dante uses Gun Barrage, Lunge Thrust or Flying Uppercut; Gojo uses Red, Blue or Shockwave; Goku uses Kamehameha or Meteor Flurry; Odette uses Petal Fan, Parasol Rise or Pirouette; JP uses Torbalan or Embrace; Revenant uses Grave Fiend, Flying Uppercut or Shade Step. Liu uses Dragon Fire, Flying Dragon Kick or Bicycle Kick (never the uppercut). Minato uses Rasengan or Flying Raijin. Musashi uses Oni Soul, Tenchi Giri or Battojutsu. Jinu uses Gat Throw, Demon Burst or Soul Snatch. Cyclops uses Optic Blast, Phoenix Rise or Firebird Dash. Each hit must connect; deals 30% less damage.</small></div>
<div class="move"><span class="move-name">Parry</span><span class="motion">Left Shift (P2: ' / Numpad 5)</span><small>Press just before an attack lands. A blue glow shows the active window (~0.15s); a successful parry avoids all damage and stuns the attacker for 0.5s. If it whiffs you are frozen for ~0.4s, unable to block, and can be thrown. Hold the key to keep the parry window open: it drains the Parry bar at about 42% per second, and when you let go (or it runs dry) you recover for ~0.17s, during which you can be hit or thrown. Every parry drains the blue Parry bar (25%, so 4 parries from full) and it recharges on its own; a successful parry gives back 12.5%. Once it is empty you cannot parry at all until it has fully recharged.</small></div>
<div class="move"><span class="move-name">Throw / Throw Break</span><span class="motion">K / Numpad 4 / ;</span><small>Close range, unblockable, 8 damage. Hold toward or away to choose throw direction. Break by throwing within ~0.1s of being grabbed.</small></div>
<div class="move"><span class="move-name">Dash / Backdash</span><span class="motion">→ → / ← ←</span><small>Double-tap toward or away from your opponent. Backdash has brief startup invincibility; don't dash into attacks.</small></div>
<div class="move"><span class="move-name">Block / Low Block</span><span class="motion">Hold ← / Hold ↓ + ←</span><small>Hold away from your opponent to block. Crouch-block to defend against low attacks.</small></div>
<div class="move"><span class="move-name">Crouch Attacks / Cancel</span><span class="motion">↓ + Medium / Heavy</span><small>Crouch + Medium sweeps; crouch + Heavy uppercuts. On hit, cancel into another move (see Chain Cancel).</small></div>
<div class="move"><span class="move-name">Chain Cancel</span><span class="motion">Hit/Block → input next move</span><small>When a move connects (hit or block), executing a new move cancels the rest of the old one. Normals chain into any normal not yet used in the string, then Fireball / Tatsumaki / Flying Uppercut, then a Super or Ultra. Specials cancel into Supers or Ultra; Supers and Ultra are final. Works in the air too. Damage scaling still applies down the combo.</small></div>
</div>
<p class="arrow-legend">Enter: start/rematch (2 players) · Both modes open a character select (WASD or arrow keys to move around the grid, U or Enter to confirm). Online: both players pick within 15 seconds (the host's room starts as soon as both have locked in); each player controls their own cursor, either key set works. C: play vs CPU at the selected level (keys 1-5 or ← → on the title screen pick the level; only P1 keys are used) · Esc: title · P: pause · Inputs are buffered for ~0.17s, motions are forgiving, and if you hold ← and → the last one pressed wins.</p>
